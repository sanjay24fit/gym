<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- Apple iOS Safari & PWA Standalone Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym Manager" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0B0E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
    <title>Gym Manager</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('gym_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#F8F9FB' : '#0A0B0E');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="google_translate_element" style="display:none"></div>
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0A0B0E;font-family:'Outfit',system-ui,-apple-system,sans-serif;z-index:99999;user-select:none;">
        <style>
          @keyframes splashInitPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:0.92}}
          @keyframes splashInitBar{0%{left:-45%}100%{left:100%}}
          [data-theme="light"] #initial-splash{background:#F8F9FB!important;}
          [data-theme="light"] #initial-splash .splash-title{color:#0A0B0E!important;}
          [data-theme="light"] #initial-splash .splash-sub{color:#687282!important;}
          [data-theme="light"] #initial-splash .splash-track{background:rgba(0,0,0,0.06)!important;}
        </style>
        <div style="width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#FF7A1A 0%,#FF5500 45%,#E63900 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(255,98,0,0.38);margin-bottom:14px;animation:splashInitPulse 1.8s ease-in-out infinite;">
          <svg width="44" height="44" viewBox="0 0 100 100" fill="none">
            <path d="M50 16C50 16 55.5 24.5 55.5 30C55.5 32.2 54.8 34.2 53.6 35.8C59.2 32.6 63 26.8 63 26.8C63 26.8 68 34.2 68 44C68 56.5 59.5 65 50 65C40.5 65 32 56.5 32 44C32 35.5 36.5 28.5 41 24.5C40.2 27.2 40.5 30.5 42 32.5C44.2 35.5 47.8 35.8 49.5 33C51.2 30.2 50.8 23 50 16Z" fill="#FFFFFF" />
            <rect x="22" y="68" width="6" height="18" rx="3" fill="#FFFFFF" />
            <rect x="30" y="71" width="5" height="12" rx="2.5" fill="#FFE2CC" />
            <rect x="35" y="74.5" width="30" height="5" rx="2.5" fill="#FFFFFF" />
            <rect x="65" y="71" width="5" height="12" rx="2.5" fill="#FFE2CC" />
            <rect x="72" y="68" width="6" height="18" rx="3" fill="#FFFFFF" />
            <circle cx="50" cy="51" r="4.5" fill="#FF5500" />
          </svg>
        </div>
        <div class="splash-title" style="font-size:22px;font-weight:800;color:#FFFFFF;letter-spacing:-0.025em;margin-bottom:2px;">Gym Manager</div>
        <div class="splash-sub" style="font-size:12.5px;color:#A2A9B8;letter-spacing:0.01em;margin-bottom:14px;">Smart Management & Member Portal</div>
        <div class="splash-track" style="width:130px;height:3.5px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;bottom:0;width:45%;background:linear-gradient(90deg,transparent,#FF6200,transparent);border-radius:99px;animation:splashInitBar 1.2s cubic-bezier(0.4,0,0.2,1) infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
