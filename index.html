<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- Apple iOS Safari & PWA Standalone Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym Manager" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#17141D" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>
    <title>Gym Manager</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('gym_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#F7F5FA' : '#17141D');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="google_translate_element" style="display:none"></div>
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0E1411;font-family:'Outfit',system-ui,-apple-system,sans-serif;z-index:99999;user-select:none;">
        <style>
          @keyframes splashInitPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:0.92}}
          @keyframes splashInitBar{0%{left:-45%}100%{left:100%}}
          [data-theme="light"] #initial-splash{background:#F7F8F5!important;}
          [data-theme="light"] #initial-splash .splash-title{color:#18231E!important;}
          [data-theme="light"] #initial-splash .splash-sub{color:#77827B!important;}
          [data-theme="light"] #initial-splash .splash-track{background:rgba(0,0,0,0.06)!important;}
        </style>
        <div style="width:68px;height:68px;border-radius:18px;background:linear-gradient(135deg,#145C43,#0B3728);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(53,185,130,0.28);margin-bottom:14px;animation:splashInitPulse 1.8s ease-in-out infinite;">
          <svg width="40" height="40" viewBox="0 0 100 100" fill="none">
            <rect x="20" y="32" width="8" height="36" rx="4" fill="#35B982" />
            <rect x="30" y="38" width="6" height="24" rx="3" fill="#D6B46A" />
            <rect x="64" y="38" width="6" height="24" rx="3" fill="#D6B46A" />
            <rect x="72" y="32" width="8" height="36" rx="4" fill="#35B982" />
            <rect x="36" y="47" width="28" height="6" rx="3" fill="#FFFFFF" />
          </svg>
        </div>
        <div class="splash-title" style="font-size:22px;font-weight:800;color:#F2F5F3;letter-spacing:-0.025em;margin-bottom:2px;">Gym Manager</div>
        <div class="splash-sub" style="font-size:12.5px;color:#96A39C;letter-spacing:0.01em;margin-bottom:14px;">Smart Management & Member Portal</div>
        <div class="splash-track" style="width:130px;height:3.5px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;bottom:0;width:45%;background:linear-gradient(90deg,transparent,#35B982,transparent);border-radius:99px;animation:splashInitBar 1.2s cubic-bezier(0.4,0,0.2,1) infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
